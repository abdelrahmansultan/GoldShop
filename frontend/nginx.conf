# Keep "https" when Caddy (or another TLS proxy) is in front of us.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
  listen 80;
  client_max_body_size 12m;
  root /usr/share/nginx/html;

  location /api/   { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $fwd_proto; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $fwd_proto; }
  location /static/ { alias /static/; }
  location /media/  { alias /media/; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
