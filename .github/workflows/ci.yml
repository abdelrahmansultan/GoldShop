name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: goldshop, POSTGRES_USER: goldshop, POSTGRES_PASSWORD: goldshop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goldshop" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env: { POSTGRES_HOST: localhost, LOG_LEVEL: WARNING }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest --create-db

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t goldshop-backend ./backend
      - run: docker build -t goldshop-web ./frontend
