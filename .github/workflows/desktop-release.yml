name: Windows desktop installer

# Run manually from the Actions tab, or push a tag like v1.0.0 to also attach
# the installer to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install desktop
        run: npm ci
        working-directory: desktop
      - name: Build installer
        run: npm run dist:win
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned build; add a code-signing cert later if needed
      - uses: actions/upload-artifact@v4
        with:
          name: GoldShop-Setup
          path: desktop/release/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Gold Shop ERP $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" desktop/release/*.exe --clobber
